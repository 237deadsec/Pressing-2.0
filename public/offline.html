<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PressingPro — Hors ligne</title>
<style>
:root{--pri:#6c5ce7;--bg:#0f1117;--txt:rgba(255,255,255,.92);--txt2:rgba(255,255,255,.65)}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(108,92,231,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(0,206,201,.06) 0%,transparent 50%);
}
.container{
  text-align:center;padding:2rem;max-width:420px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.icon{font-size:4rem;margin-bottom:1rem;opacity:.8}
h1{font-size:1.5rem;margin-bottom:.5rem}
p{color:var(--txt2);margin-bottom:1.5rem;line-height:1.6}
.btn{
  display:inline-block;padding:12px 28px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;
  font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;
  transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(108,92,231,.4)}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="container">
  <div class="icon">📡</div>
  <h1>Connexion perdue</h1>
  <p>Vous êtes actuellement hors ligne.<br>
     Vérifiez votre connexion internet puis réessayez.</p>
  <button class="btn" onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
